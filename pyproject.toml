[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spAlignDE"
version = "0.1.0"
description = "Structure-guided spatial alignment and mismatch-aware local differential expression"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Su Xu"},
  {name = "Yu Wang"},
  {name = "Lingzhen Meng"},
  {name = "Aarya Dalal"},
  {name = "Yuxin Yin"},
  {name = "Dongyuan Song"},
]
dependencies = [
  "anndata>=0.10",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "shapely>=2.0",
  "torch>=2.7,<2.11",
]

[project.urls]
Repository = "https://github.com/dsong-lab/spAlignDE"
Issues = "https://github.com/dsong-lab/spAlignDE/issues"

[project.optional-dependencies]
clustering = [
  "banksy @ git+https://github.com/prabhakarlab/Banksy_py.git",
  "harmonypy>=0.0.9",
  "scanpy>=1.10",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "seaborn>=0.13",
]
atlas = [
  "opencv-python-headless>=4.8",
  "pynrrd>=1.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
]
histology = [
  "einops>=0.7",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "pyyaml>=6",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "tifffile>=2024.2",
  "torchvision>=0.22,<0.26",
  "umap-learn>=0.5",
]
ui = [
  "matplotlib>=3.7",
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "pillow>=10",
  "plotly>=5.14,<6",
  "pynrrd>=1.0",
  "scipy>=1.10",
  "streamlit>=1.60,<2",
]
tutorial = [
  "h5py>=3.8",
  "ipykernel>=6",
  "ipywidgets>=8",
  "jupyter>=1",
  "nbconvert>=7",
  "scanpy>=1.10",
]
test = [
  "pytest>=8",
]

[tool.setuptools]
py-modules = ["spAlignDE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
