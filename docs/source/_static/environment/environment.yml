name: spAlignDE-notebooks
channels:
  - conda-forge
dependencies:
  - python=3.10.14
  - pip=26.0.1
  - setuptools=80.9.0
  - wheel=0.46.3
  - pip:
      # PyTorch 2.10 + CUDA 12.8 is the validated coherent pair for the
      # Blackwell GPU used to validate the release workflows. Local version
      # suffixes force Pip to select the CUDA 12.8 wheels from this index.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0+cu128
      - torchvision==0.25.0+cu128

      # Core AnnData and S-LDDMM runtime
      - anndata==0.10.9
      - h5py==3.15.1
      - matplotlib==3.10.7
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.10.1
      - shapely==2.1.2

      # BANKSY/Harmony/Leiden clustering
      - pybanksy @ git+https://github.com/prabhakarlab/Banksy_py.git@43e2d692db6705c0195039764194473912e4cfc2
      - harmonypy==0.2.0
      - igraph==0.11.9
      - leidenalg==0.10.2
      - louvain==0.8.2
      - scanpy==1.10.3
      - scikit-image==0.24.0
      - scikit-learn==1.7.2
      - seaborn==0.13.2

      # Allen CCF and histology workflows
      - einops==0.8.1
      - imagecodecs==2025.3.30
      # OpenCV 4.12 requires NumPy >=2 on Python >=3.9. Keep 4.10 for the
      # NumPy 1.26/Scanpy stack used by the validated notebooks.
      - opencv-python-headless==4.10.0.84
      - pillow==12.1.0
      - pynrrd==1.0.0
      - pyyaml==6.0
      - tifffile==2025.5.10
      - umap-learn==0.5.11

      # Jupyter execution and interactive controls
      - ipykernel==7.1.0
      - ipywidgets==8.1.8
      - jupyterlab==4.5.0
      - nbconvert==7.16.6
      - nbformat==5.10.4

      # Interactive region pairing interface
      - plotly==5.14.1
      - streamlit==1.60.0

      # Documentation build and validation
      - myst-nb==1.1.2
      - pytest==9.1.1
      - sphinx==7.4.7
      - sphinx-rtd-theme==2.0.0
